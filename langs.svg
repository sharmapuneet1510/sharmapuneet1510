<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 496 236" width="496" height="236" role="img" aria-label="Languages by share of code">
<title>Languages</title>
<defs><style type="text/css"><![CDATA[
.rv{opacity:0;animation:rv .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rv{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.draw{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.4s cubic-bezier(.16,1,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sheen{animation:sheen 9s ease-in-out 2.5s infinite}
@keyframes sheen{0%{transform:translateX(0)}55%,100%{transform:translateX(760px)}}
@media (prefers-reduced-motion:reduce){
  .rv,.draw,.grow{animation:none;opacity:1;transform:none;stroke-dashoffset:0}
  .sheen{animation:none;opacity:0}
}

.grow{transform:scaleX(0);animation:grow 1.5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
]]></style>
<clipPath id="cardclip"><rect x="1" y="1" width="494" height="234" rx="3"/></clipPath>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#E8DFD8" stop-opacity="0"/>
  <stop offset="50%" stop-color="#E8DFD8" stop-opacity=".05"/>
  <stop offset="100%" stop-color="#E8DFD8" stop-opacity="0"/>
</linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.4"/></feComponentTransfer><feComposite operator="in" in2="SourceGraphic"/></filter>
</defs>
<rect width="496" height="236" fill="#000000"/>

<rect x="1" y="1" width="494" height="234" rx="3" fill="#080706" stroke="#3a342d"/>
<rect x="1" y="1" width="494" height="3" fill="#D4AF37" opacity=".55"/>
<text class="rv" style="animation-delay:.15s" x="22" y="38" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11"
      letter-spacing="3.2" fill="#D4AF37">THE MATERIAL</text>
<line class="draw" style="animation-delay:.3s" x1="22" y1="52" x2="474" y2="52"
      stroke="#3a342d" stroke-width="1"/>
<g clip-path="url(#cardclip)"><rect class="sheen" x="-200" y="0" width="150" height="236" fill="url(#sheen)"/></g>

<rect class="grow" style="animation-delay:0.55s;transform-origin:22.0px 0" x="22.0" y="72" width="237.4" height="9" fill="#D4AF37"/><rect class="grow" style="animation-delay:0.64s;transform-origin:259.4px 0" x="259.4" y="72" width="134.2" height="9" fill="#b09a72"/><rect class="grow" style="animation-delay:0.73s;transform-origin:393.6px 0" x="393.6" y="72" width="43.4" height="9" fill="#8a7a68"/><rect class="grow" style="animation-delay:0.82s;transform-origin:437.0px 0" x="437.0" y="72" width="18.3" height="9" fill="#6b6259"/><rect class="grow" style="animation-delay:0.91s;transform-origin:455.3px 0" x="455.3" y="72" width="12.3" height="9" fill="#514a42"/><rect class="grow" style="animation-delay:1.00s;transform-origin:467.6px 0" x="467.6" y="72" width="6.4" height="9" fill="#3a342d"/>

<g class="rv" style="animation-delay:0.85s">
  <rect x="22" y="107" width="9" height="9" fill="#D4AF37"/>
  <text x="40" y="116" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#cbb59d">Python</text>
