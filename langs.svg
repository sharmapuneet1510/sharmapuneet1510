</g>
<g class="rv" style="animation-delay:1.01s">
  <rect x="22" y="141" width="9" height="9" fill="#8a7a68"/>
  <text x="40" y="150" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#cbb59d">TypeScript</text>
