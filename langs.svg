  <text x="466" y="150" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#E8DFD8">4.0%</text>
</g>
<g class="rv" style="animation-delay:1.17s">
  <rect x="22" y="175" width="9" height="9" fill="#514a42"/>
  <text x="40" y="184" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#cbb59d">JavaScript</text>
  <text x="230" y="184" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#E8DFD8">2.7%</text>
</g>
<g class="rv" style="animation-delay:1.25s">
  <rect x="258" y="175" width="9" height="9" fill="#3a342d"/>
  <text x="276" y="184" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#cbb59d">CSS</text>
  <text x="466" y="184" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" fill="#E8DFD8">1.4%</text>
</g>
<rect width="496" height="236" filter="url(#grain)" opacity="0.055" fill="#E8DFD8"/>
</svg>
