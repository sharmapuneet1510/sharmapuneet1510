name: Contribution snake

on:
  schedule:
    - cron: "42 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Draw
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sharmapuneet1510
          outputs: |
            dist/snake.svg?color_snake=#D4AF37&color_dots=#141210,#4a443d,#8a7a68,#cbb59d,#E8DFD8

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
