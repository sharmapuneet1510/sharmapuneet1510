name: Contribution Graph

on:
  schedule:
    - cron: "17 3 * * *"   # daily, off the top of the hour
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/contribution_graph.py"
      - ".github/workflows/contribution-graph.yml"

permissions:
  contents: write

concurrency:
  group: contribution-graph
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: sharmapuneet1510
        run: python scripts/contribution_graph.py --out assets

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-dark.svg assets/contrib-light.svg
          if git diff --cached --quiet; then
            echo "Graph unchanged."
          else
            git commit -m "chore: refresh contribution graph"
            git push
          fi
