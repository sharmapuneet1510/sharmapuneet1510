,serif" font-size="60" fill="#E8DFD8">M</text><text class="ltr" style="animation-delay:1.25s" x="934.0" y="212" text-anchor="middle" font-family="Georgia,'Times New Roman','Nimbus Roman',serif" font-size="60" fill="#E8DFD8">A</text>

