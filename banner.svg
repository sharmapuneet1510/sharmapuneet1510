<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Puneet Sharma — Lead Architect, AI Systems, Tokyo">
<title>Puneet Sharma — Lead Architect · AI Systems · Tokyo</title>
<defs>
<style type="text/css"><![CDATA[
.ltr{opacity:0;animation:ltr 1.1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes ltr{from{opacity:0;transform:translateY(18px);filter:blur(6px)}
              to{opacity:1;transform:translateY(0);filter:blur(0)}}
.rv{opacity:0;animation:rv 1.1s cubic-bezier(.16,1,.3,1) forwards}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.draw{stroke-dasharray:320;stroke-dashoffset:320;animation:draw 1.6s cubic-bezier(.16,1,.3,1) 1.35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.frameline{stroke-dasharray:1160;stroke-dashoffset:1160;animation:fl 2.2s cubic-bezier(.16,1,.3,1) .1s forwards}
@keyframes fl{to{stroke-dashoffset:0}}
.mote{opacity:0;animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}18%{opacity:.5}
                82%{opacity:.5}100%{transform:translateY(-250px);opacity:0}}
.pulse{animation:pulse 3.4s ease-in-out 2s infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){
  .ltr,.rv,.draw,.frameline{animation:none;opacity:1;transform:none;filter:none;stroke-dashoffset:0}
  .mote{animation:none;opacity:.4}
  .pulse{animation:none;opacity:.7}
}
]]></style>
<radialGradient id="vig" cx="50%" cy="46%" r="72%">
  <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="62%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000" stop-opacity=".85"/>
</radialGradient>
<radialGradient id="key" cx="50%" cy="48%" r="46%">
  <stop offset="0%" stop-color="#D4AF37" stop-opacity=".085"/>
  <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
</radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="1.4"/></feComponentTransfer><feComposite operator="in" in2="SourceGraphic"/></filter>
</defs>

<rect width="1280" height="420" fill="#000000"/>
